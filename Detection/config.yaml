# =============================================================================
# ILI Component Detection Configuration (Detectron2)
# =============================================================================
# Faster R-CNN with ResNeXt-101-FPN for ILI component detection.

# --- Data ---
data_dir: Data
data_json: data.json
images_folder: images
train_split: 0.7
val_split: 0.15
random_state: 111
# Max fraction of dataset that can be empty images (no annotations after
# class filtering).  Useful when excluded classes (e.g. Sleeve) leave many
# images with zero labels.  null = keep all, 0.0 = remove all, 0.1 = ~10%.
max_empty_ratio: 0.1

# --- ILI augmentations (track-based, tubeview) ---
num_tracks: 22
max_track_shift: 25
track_shift_prob: 0.5
circular_roll_prob: 0.3
split_wrapped_boxes: true

# --- Model ---
model_config: COCO-Detection/faster_rcnn_X_101_32x8d_FPN_3x.yaml
num_classes: 3
class_names: ["Fitting", "Valve", "stopple"]
# Merge similar annotation labels into a single class
class_merge:
  tap: "Fitting"       # tap annotations → Fitting
  tee: "stopple"       # tee annotations → stopple
freeze_at: 0

# --- Training ---
max_iter: 10000
batch_size: 4
num_workers: 4
# Class-balanced sampling: oversample rare classes (RepeatFactorTrainingSampler)
# threshold=0.5 ensures classes appearing in <50% of images get oversampled
# sqrt=true uses sqrt for repeat factor (gentler upsampling vs linear)
repeat_threshold: 0.5
repeat_sqrt: true
lr: 0.00025
lr_scheduler: WarmupMultiStepLR
steps: [6000, 8000]
roi_heads_batch_size: 512
score_thresh_test: 0.6

# --- Evaluation ---
eval_period: 100

# --- Logging ---
img_log_step: 100
checkpoint_period: 500

# --- Device ---
device: [0]
